# Default training settings. Any key can be overridden from the CLI, e.g. --epochs 50
data: data/training_data      # folder with one sub-folder per sample (see README)
output: runs                  # each run is saved to runs/<n>/
image_size: 256               # must be a multiple of 32
batch_size: 8
epochs: 100
lr: 0.001
val_split: 0.2                # fraction of the data used for validation
data_fraction: 1.0            # use less than 1.0 for a quick smoke test
save_every: 5                 # checkpoint every N epochs
device: auto                  # auto | cuda | mps | cpu
resume: null                  # path to a checkpoint.pt to continue training from
